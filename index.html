<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>赛博轮盘 - 终极穿透版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* 消除所有默认边距，防止页面滚动 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }

        /* 全屏视频样式 */
        .fullscreen-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; transition: all 0.3s ease-in-out; }

        /* 悬浮小窗样式 (画中画) */
        .pip-video { position: absolute; width: 120px; height: 180px; top: 20px; right: 20px; border-radius: 12px; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); object-fit: cover; transform: scaleX(-1); z-index: 10; cursor: grab; transition: none; }
        .pip-video:active { cursor: grabbing; }

        /* UI 悬浮层 */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; box-sizing: border-box; }

        /* 状态提示增加毛玻璃感 */
        #status { background: rgba(0, 0, 0, 0.6); color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; backdrop-filter: blur(10px); margin-top: 20px; text-align: center; max-width: 80%; }

        /* 底部操作区 */
        .bottom-controls { pointer-events: auto; width: 100%; display: flex; justify-content: center; padding-bottom: 40px; }

        button { background-color: #00ff88; color: #000; border: none; padding: 18px 45px; font-size: 18px; font-weight: bold; border-radius: 40px; cursor: pointer; box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3); transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        .btn-next { background-color: #ff4444; color: #fff; box-shadow: 0 8px 25px rgba(255, 68, 68, 0.3); }
    </style>
</head>
<body>

    <video id="remoteVideo" class="fullscreen-video" autoplay playsinline style="display: none;"></video>
    <video id="localVideo" class="fullscreen-video" autoplay muted playsinline></video>

    <div class="ui-layer">
        <div id="status">正在初始化摄像头...</div>
        <div class="bottom-controls">
            <button id="actionBtn" disabled>开始匹配</button>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const actionBtn = document.getElementById('actionBtn');

        let localStream, peer, mqttClient, myPeerId, currentCall = null;
        let isLooking = false, radarInterval = null, networkReady = false;

        const ROOM_TOPIC = 'cyber-roulette-lobby-v3'; // 升级频道版本避免干扰

        // ================= 1. 自动开启摄像头 =================
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.innerText = "正在配置全球中转通道...";
                initNetwork();
            } catch (err) {
                statusDiv.innerText = "❌ 摄像头权限被拒绝，请允许后刷新";
                statusDiv.style.background = "rgba(255, 0, 0, 0.7)";
            }
        }

        // ================= 2. 网络初始化 (核心修复：增加 TURN 支持) =================
        function initNetwork() {
            myPeerId = Math.random().toString(36).substring(2, 10);

            // 配置 PeerJS，加入打洞和中转服务器
            peer = new Peer(myPeerId, {
                config: {
                    'iceServers': [
                        // 1. 基础 STUN 直连服务器 (Google 提供)
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },

                        // 2. 关键：TURN 中转服务器 (Open Relay Project)
                        // 当 5G/WiFi 跨地域直连失败时，流量会通过此处中转，确保 100% 成功
                        {
                            urls: [
                                'turn:openrelay.metered.ca:80',
                                'turn:openrelay.metered.ca:443',
                                'turn:openrelay.metered.ca:443?transport=tcp'
                            ],
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        }
                    ]
                }
            });

            peer.on('open', (id) => {
                // 使用之前测试最稳的 EMQX 节点
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
                mqttClient.on('connect', () => {
                    mqttClient.subscribe(ROOM_TOPIC);
                    networkReady = true;
                    statusDiv.innerText = "✅ 全球通道就绪！准备匹配了吗？";
                    actionBtn.disabled = false;
                });

                mqttClient.on('message', (topic, message) => {
                    if (!isLooking) return;
                    const msg = JSON.parse(message.toString());
                    if (msg.id !== myPeerId && msg.type === 'looking' && myPeerId > msg.id) {
                        connectToStranger(msg.id);
                    }
                });
            });

            peer.on('call', (call) => {
                if (!isLooking) {
                    setTimeout(() => call.close(), 500);
                    return;
                }
                stopLooking();
                statusDiv.innerText = "正在连接对方...";
                call.answer(localStream);
                handleCall(call);
            });
        }

        // ================= 3. 通话与匹配逻辑 =================
        function startLooking() {
            if (currentCall) { currentCall.close(); }
            switchToWaitingUI();
            isLooking = true;
            statusDiv.innerText = "📡 正在寻找有缘人...";
            actionBtn.innerText = "匹配中...";
            actionBtn.disabled = true;

            radarInterval = setInterval(() => {
                if (isLooking) mqttClient.publish(ROOM_TOPIC, JSON.stringify({ type: 'looking', id: myPeerId }));
            }, 2000);
        }

        function stopLooking() {
            isLooking = false;
            if (radarInterval) clearInterval(radarInterval);
        }

        function connectToStranger(targetPeerId) {
            stopLooking();
            statusDiv.innerText = "发现目标，正在握手...";
            const call = peer.call(targetPeerId, localStream);
            handleCall(call);
        }

        function handleCall(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                if (remoteVideo.srcObject !== remoteStream) {
                    remoteVideo.srcObject = remoteStream;
                }
                remoteVideo.play().then(switchToConnectedUI).catch((err) => {
                    statusDiv.innerText = "⚠️ 画面已通，轻触屏幕开始";
                    document.body.onclick = () => { remoteVideo.play(); switchToConnectedUI(); document.body.onclick = null; };
                });
            });
            call.on('close', startLooking);
            call.on('error', startLooking);
        }

        // ================= 4. UI 切换 =================
        function switchToWaitingUI() {
            remoteVideo.style.display = 'none';
            remoteVideo.srcObject = null;
            localVideo.className = 'fullscreen-video';
            localVideo.style.left = ''; localVideo.style.top = '';
            actionBtn.className = '';
        }

        function switchToConnectedUI() {
            statusDiv.innerText = "🟢 连接成功！打个招呼吧";
            remoteVideo.style.display = 'block';
            localVideo.className = 'pip-video';
            actionBtn.disabled = false;
            actionBtn.innerText = "⏭️ 换一个人";
            actionBtn.className = 'btn-next';
        }

        actionBtn.onclick = () => {
            if (networkReady) startLooking();
        };

        // ================= 5. 小窗拖拽逻辑 =================
        let isDragging = false, ox, oy;
        const dragStart = (e) => {
            if (localVideo.className !== 'pip-video') return;
            isDragging = true;
            const t = e.touches ? e.touches[0] : e;
            const r = localVideo.getBoundingClientRect();
            ox = t.clientX - r.left; oy = t.clientY - r.top;
        };
        const dragMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const t = e.touches ? e.touches[0] : e;
            localVideo.style.right = 'auto';
            let nx = Math.max(0, Math.min(t.clientX - ox, window.innerWidth - localVideo.offsetWidth));
            let ny = Math.max(0, Math.min(t.clientY - oy, window.innerHeight - localVideo.offsetHeight));
            localVideo.style.left = nx + 'px'; localVideo.style.top = ny + 'px';
        };
        localVideo.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('touchend', () => isDragging = false);
        localVideo.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', () => isDragging = false);

        window.onload = initCamera;
    </script>
</body>
</html>
