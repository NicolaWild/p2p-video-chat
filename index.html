<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>赛博轮盘 - 稳定直连版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }

        .fullscreen-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; transition: all 0.3s ease-in-out; }

        /* 画中画样式 */
        .pip-video { position: absolute; width: 110px; height: 160px; top: env(safe-area-inset-top, 20px); right: 20px; border-radius: 12px; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); object-fit: cover; transform: scaleX(-1); z-index: 10; cursor: grab; transition: none; }
        .pip-video:active { cursor: grabbing; }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: env(safe-area-inset-top, 40px) 0 env(safe-area-inset-bottom, 40px) 0; box-sizing: border-box; }

        #status { background: rgba(0, 0, 0, 0.6); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; backdrop-filter: blur(10px); margin-top: 20px; text-align: center; }

        /* 底部控制面板 */
        .bottom-panel { pointer-events: auto; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(15px); padding: 25px 20px; border-radius: 24px 24px 0 0; width: 100%; max-width: 400px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); transition: transform 0.3s ease; }

        .panel-hidden { transform: translateY(120%); } /* 连通后隐藏面板 */

        .my-id-box { color: #aaa; font-size: 14px; text-align: center; }
        .my-id-number { color: #00ff88; font-size: 28px; font-weight: bold; letter-spacing: 2px; display: block; margin-top: 5px; }

        .input-group { display: flex; width: 100%; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 12px; border: none; font-size: 18px; text-align: center; background: #333; color: white; outline: none; }
        input::placeholder { color: #888; }

        button { background-color: #00ff88; color: #000; border: none; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: transform 0.1s; white-space: nowrap; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        /* 🔥 挂断按钮：绝对定位到屏幕底部居中 🔥 */
        .btn-hangup {
            background-color: #ff4444;
            color: white;
            border-radius: 30px;
            padding: 16px 50px;
            font-size: 16px;
            display: none;
            pointer-events: auto;

            /* 把它“钉”在底部 */
            position: absolute;
            /* 距离底部 40px，并加上刘海屏底部安全高度 */
            bottom: calc(env(safe-area-inset-bottom, 20px) + 40px);
            left: 50%;
            transform: translateX(-50%); /* 保证完美居中 */
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.4);
            z-index: 30;
        }
        /* 修复居中状态下的点击缩放动画 */
        .btn-hangup:active { transform: translateX(-50%) scale(0.95); }
    </style>
</head>
<body>

    <video id="remoteVideo" class="fullscreen-video" autoplay playsinline style="display: none;"></video>
    <video id="localVideo" class="fullscreen-video" autoplay muted playsinline></video>

    <div class="ui-layer">
        <div id="status">正在启动引擎...</div>

        <button id="hangupBtn" class="btn-hangup">挂断通话</button>

        <div id="bottomPanel" class="bottom-panel">
            <div class="my-id-box">
                你的专属暗号
                <span id="myIdDisplay" class="my-id-number">----</span>
            </div>
            <div class="input-group">
                <input type="number" id="targetIdInput" placeholder="输入朋友的暗号">
                <button id="callBtn" disabled>拨号</button>
            </div>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const bottomPanel = document.getElementById('bottomPanel');
        const myIdDisplay = document.getElementById('myIdDisplay');
        const targetIdInput = document.getElementById('targetIdInput');
        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');

        let localStream, peer, currentCall = null;

        // 生成 4 位随机数字作为简单 ID
        const myShortId = Math.floor(1000 + Math.random() * 9000).toString();

        // ================= 1. 初始化引擎 =================
        async function init() {
            try {
                // 1. 获取摄像头
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.innerText = "正在连接全球信令服务器...";

                // 2. 初始化 PeerJS，喂给它最全的打洞和中转节点
                peer = new Peer(myShortId, {
                    config: {
                        'iceServers': [
                            // 🔥 国内大厂免费 STUN（核心杀手锏，极速打洞）
                            { urls: 'stun:stun.qq.com:3478' },           // 腾讯
                            { urls: 'stun:stun.miwifi.com:3478' },       // 小米
                            { urls: 'stun:stun.chat.bilibili.com:3478' },// B站

                            // 国外的保留作为备用兜底
                            { urls: 'stun:stun.l.google.com:19302' },
                            {
                                urls: [
                                    'turn:openrelay.metered.ca:80',
                                    'turn:openrelay.metered.ca:443?transport=tcp'
                                ],
                                username: 'openrelayproject',
                                credential: 'openrelayproject'
                            }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    myIdDisplay.innerText = id;
                    statusDiv.innerText = "✅ 就绪！把暗号发给朋友吧";
                    callBtn.disabled = false;
                });

                // 被动接听
                peer.on('call', (call) => {
                    statusDiv.innerText = "收到视频请求，正在接通...";
                    call.answer(localStream);
                    handleCall(call);
                });

                // 处理错误
                peer.on('error', (err) => {
                    statusDiv.innerText = "❌ 发生错误: " + err.type;
                    console.error(err);
                    resetUI();
                });

            } catch (err) {
                statusDiv.innerText = "❌ 摄像头获取失败，请刷新并授权";
            }
        }

        // ================= 2. 通话核心逻辑 =================
        callBtn.onclick = () => {
            const targetId = targetIdInput.value.trim();
            if (!targetId || targetId.length !== 4) return alert("请输入 4 位有效暗号！");
            if (targetId === myShortId) return alert("不能拨打给自己！");

            statusDiv.innerText = "正在呼叫 " + targetId + " ...";
            callBtn.disabled = true;

            const call = peer.call(targetId, localStream);
            handleCall(call);
        };

        function handleCall(call) {
            currentCall = call;

            // 监听底层穿透状态（帮你排错）
            call.peerConnection.oniceconnectionstatechange = () => {
                const state = call.peerConnection.iceConnectionState;
                console.log("ICE 状态:", state);
                if (state === 'failed') {
                    statusDiv.innerText = "❌ 防火墙阻断，连接失败";
                    setTimeout(resetUI, 3000);
                }
            };

            call.on('stream', (remoteStream) => {
                if (remoteVideo.srcObject !== remoteStream) {
                    remoteVideo.srcObject = remoteStream;
                }
                remoteVideo.play().then(switchToConnectedUI).catch((err) => {
                    statusDiv.innerText = "⚠️ 请点击屏幕任意位置显示画面";
                    document.body.onclick = () => { remoteVideo.play(); switchToConnectedUI(); document.body.onclick = null; };
                });
            });

            call.on('close', () => {
                statusDiv.innerText = "通话已结束";
                resetUI();
            });

            call.on('error', () => {
                resetUI();
            });
        }

        hangupBtn.onclick = () => {
            if (currentCall) currentCall.close();
            resetUI();
        };

        // ================= 3. 界面切换与拖拽 =================
        function switchToConnectedUI() {
            statusDiv.innerText = "🟢 视频已接通";
            remoteVideo.style.display = 'block';
            localVideo.className = 'pip-video';
            bottomPanel.classList.add('panel-hidden'); // 隐藏拨号盘
            hangupBtn.style.display = 'block';         // 显示挂断按钮
        }

        function resetUI() {
            if (currentCall) { currentCall.close(); currentCall = null; }
            remoteVideo.style.display = 'none';
            remoteVideo.srcObject = null;
            localVideo.className = 'fullscreen-video';
            localVideo.style.left = ''; localVideo.style.top = ''; localVideo.style.right = '';

            bottomPanel.classList.remove('panel-hidden');
            hangupBtn.style.display = 'none';
            callBtn.disabled = false;
            statusDiv.innerText = "✅ 就绪！把暗号发给朋友吧";
        }

        // 丝滑拖拽逻辑
        let isDragging = false, ox, oy;
        const dragStart = (e) => {
            if (localVideo.className !== 'pip-video') return;
            isDragging = true;
            const t = e.touches ? e.touches[0] : e;
            const r = localVideo.getBoundingClientRect();
            ox = t.clientX - r.left; oy = t.clientY - r.top;
        };
        const dragMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const t = e.touches ? e.touches[0] : e;
            localVideo.style.right = 'auto';
            let nx = Math.max(0, Math.min(t.clientX - ox, window.innerWidth - localVideo.offsetWidth));
            let ny = Math.max(0, Math.min(t.clientY - oy, window.innerHeight - localVideo.offsetHeight));
            localVideo.style.left = nx + 'px'; localVideo.style.top = ny + 'px';
        };
        localVideo.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('touchend', () => isDragging = false);
        localVideo.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', () => isDragging = false);

        window.onload = init;
    </script>
</body>
</html>
