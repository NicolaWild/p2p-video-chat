<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P 视频直连 (PeerJS稳定版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .video-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        video { width: 100%; max-width: 400px; height: 250px; background-color: #000; border-radius: 12px; border: 2px solid #333; object-fit: cover; transform: scaleX(-1); }
        .control-panel { background: #333; padding: 15px; border-radius: 10px; margin-top: 15px; }
        input { padding: 10px; font-size: 16px; width: 60%; border-radius: 5px; border: none; text-align: center; margin-bottom: 10px; }
        button { background-color: #00ff88; color: #000; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #myIdDisplay { color: #00ff88; font-weight: bold; font-size: 20px; letter-spacing: 2px; }
        #status { margin-top: 15px; color: #ffeb3b; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>PeerJS 稳定直连测试</h2>

    <div class="control-panel">
        <p>你的专属暗号：<br><span id="myIdDisplay">正在获取...</span></p>
        <div id="status">正在连接官方信令服务器...</div>

        <hr style="border-color: #555; margin: 15px 0;">

        <input type="text" id="targetIdInput" placeholder="输入对方的暗号">
        <br>
        <button id="callBtn" disabled>发起视频呼叫</button>
    </div>

    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const myIdDisplay = document.getElementById('myIdDisplay');
        const statusDiv = document.getElementById('status');
        const targetIdInput = document.getElementById('targetIdInput');
        const callBtn = document.getElementById('callBtn');

        let localStream;

        // 1. 初始化 Peer，自动连接到 PeerJS 的免费公共云服务器
        // 随机生成一个 4 位数的简单暗号，方便手机输入
        const randomId = Math.floor(1000 + Math.random() * 9000).toString();
        const peer = new Peer(randomId, {
            debug: 2,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        // 2. 成功连上公共服务器，拿到自己的暗号
        peer.on('open', async (id) => {
            myIdDisplay.innerText = id;
            statusDiv.innerText = "✅ 已连上服务器！请允许摄像头权限。";
            statusDiv.style.color = "#00ff88";

            try {
                // 获取摄像头
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                callBtn.disabled = false;
                statusDiv.innerText = "摄像头已就绪，等待呼叫或被呼叫...";
            } catch (err) {
                alert("无法访问摄像头: " + err.message);
            }
        });

        // 3. 处理别人打来的视频电话（被动接听）
        peer.on('call', (call) => {
            statusDiv.innerText = "收到视频请求，自动接听中...";
            // 把自己的视频流发给对方
            call.answer(localStream);

            // 收到对方的视频流并播放
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.innerText = "🟢 P2P 视频直连成功！";
            });
        });

        // 4. 主动给别人打视频电话
        callBtn.onclick = () => {
            const targetId = targetIdInput.value.trim();
            if (!targetId) {
                alert("请输入对方的暗号！");
                return;
            }

            statusDiv.innerText = "正在呼叫对方...";
            // 发起呼叫，带上自己的视频流
            const call = peer.call(targetId, localStream);

            // 收到对方的视频流并播放
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.innerText = "🟢 P2P 视频直连成功！";
            });

            call.on('error', (err) => {
                statusDiv.innerText = "❌ 呼叫失败: " + err.type;
                statusDiv.style.color = "#ff4444";
            });
        };
    </script>
</body>
</html>
