<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>去中心化视频轮盘 (终极形态)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        .video-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }
        video { width: 100%; max-width: 450px; height: 300px; background-color: #222; border-radius: 12px; border: 2px solid #444; object-fit: cover; transform: scaleX(-1); cursor: pointer; }
        .control-panel { background: #222; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #333; }
        button { background-color: #00ff88; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; width: 80%; max-width: 300px; transition: all 0.2s; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        .btn-next { background-color: #ff4444; color: white; margin-top: 10px; display: none; }
        #status { margin-top: 10px; color: #ffeb3b; font-size: 15px; font-weight: bold; }
        .label { margin: 0; color: #aaa; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🎲 赛博随机轮盘</h2>

    <div class="control-panel">
        <div id="status">系统初始化中...</div>
        <button id="startBtn" disabled>开启摄像头并匹配</button>
        <button id="nextBtn" class="btn-next">⏭️ 换一个人 (Next)</button>
    </div>

    <div class="video-container">
        <p class="label">我的画面</p>
        <video id="localVideo" autoplay muted playsinline></video>
        <p class="label">对方画面 (黑屏请点击画面)</p>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');

        let localStream;
        let peer;
        let mqttClient;
        let myPeerId;
        let currentCall = null;
        let isLooking = false;
        let radarInterval = null;

        const ROOM_TOPIC = 'cyber-roulette-lobby-v1';

        // ================= 1. 初始化两套网络 =================

        // 1.1 初始化 PeerJS (视频底层)
        myPeerId = Math.random().toString(36).substring(2, 10);
        peer = new Peer(myPeerId, {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            // 1.2 初始化 MQTT (寻人雷达)
            // 使用之前你在手机上成功连通的 EMQX 节点
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                mqttClient.subscribe(ROOM_TOPIC);
                statusDiv.innerText = "✅ 就绪！点击下方按钮开始寻找陌生人。";
                statusDiv.style.color = "#00ff88";
                startBtn.disabled = false;
            });
        });

        // ================= 2. 匹配逻辑 (核心) =================

        // 收到大厅里的广播
        mqttClient.on('message', (topic, message) => {
            if (!isLooking) return; // 如果我没在找人，直接无视大厅声音

            const msg = JSON.parse(message.toString());
            if (msg.id === myPeerId) return; // 无视自己的回音

            if (msg.type === 'looking') {
                // 发现目标！ID 大的人负责主动拨号，防止互相拨号导致冲突
                if (myPeerId > msg.id) {
                    connectToStranger(msg.id);
                }
            }
        });

        // 开启雷达寻找
        function startLooking() {
            if (currentCall) {
                currentCall.close(); // 挂断当前电话
                remoteVideo.srcObject = null; // 清空对方画面
            }

            isLooking = true;
            statusDiv.innerText = "📡 雷达扫描中，等待有缘人...";
            statusDiv.style.color = "#ffeb3b";
            startBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';
            nextBtn.disabled = true; // 还没连上时，不能狂点 next

            // 每 2 秒在大厅喊一次我的 PeerID
            radarInterval = setInterval(() => {
                if (isLooking) {
                    mqttClient.publish(ROOM_TOPIC, JSON.stringify({ type: 'looking', id: myPeerId }));
                }
            }, 2000);
        }

        // 停止雷达
        function stopLooking() {
            isLooking = false;
            if (radarInterval) clearInterval(radarInterval);
        }

        // 主动拨打对方
        function connectToStranger(targetPeerId) {
            stopLooking();
            statusDiv.innerText = "锁定目标，正在拨号建立直连...";

            const call = peer.call(targetPeerId, localStream);
            handleCall(call);
        }

        // 被动接听对方
        peer.on('call', (call) => {
            if (!isLooking) {
                // 如果我正在聊天，别人打进来，直接挂断
                setTimeout(() => call.close(), 500);
                return;
            }

            stopLooking();
            statusDiv.innerText = "收到连接请求，自动接听中...";
            call.answer(localStream);
            handleCall(call);
        });

        // 统一处理通话状态
        function handleCall(call) {
            currentCall = call;

            call.on('stream', (remoteStream) => {
                // 防止重复触发
                if (remoteVideo.srcObject !== remoteStream) {
                    remoteVideo.srcObject = remoteStream;
                }

                remoteVideo.play().then(() => {
                    statusDiv.innerText = "🟢 匹配成功！开始聊天吧！";
                    statusDiv.style.color = "#00ff88";
                    nextBtn.disabled = false; // 连上后，允许点击 Next
                }).catch((err) => {
                    statusDiv.innerText = "⚠️ 浏览器拦截声音，请点击下方画面！";
                    statusDiv.style.color = "#ff4444";
                    remoteVideo.onclick = () => { remoteVideo.play(); statusDiv.innerText = "🟢 匹配成功！"; statusDiv.style.color = "#00ff88"; };
                    nextBtn.disabled = false;
                });
            });

            // 如果对方掉线或挂断
            call.on('close', () => {
                if (!isLooking) {
                    statusDiv.innerText = "❌ 对方已离开，自动重新寻找...";
                    startLooking();
                }
            });

            call.on('error', (err) => {
                console.error("连接出错:", err);
                startLooking(); // 出错就重新找人
            });
        }

        // ================= 3. 用户按钮交互 =================

        // 第一次点击：获取摄像头并开始匹配
        startBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                startLooking();
            } catch (err) {
                alert("无法访问摄像头: " + err.message);
            }
        };

        // 点击 Next：挂断并重新匹配
        nextBtn.onclick = () => {
            statusDiv.innerText = "你跳过了对方...";
            startLooking();
        };

    </script>
</body>
</html>
