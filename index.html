<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>德州桌上助手</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md mx-auto">
        <h2 class="text-xl font-bold text-center mb-4 text-gray-800">🃏 德州结算助手</h2>

        <div class="card p-4 mb-4 grid grid-cols-2 gap-4 bg-slate-800 text-white">
            <div>
                <label class="block text-xs text-slate-400 mb-1">一手筹码</label>
                <input v-model.number="config.chips" type="number" class="w-full bg-slate-700 rounded p-2 text-center border-none">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">单价 (元)</label>
                <input v-model.number="config.price" type="number" class="w-full bg-slate-700 rounded p-2 text-center border-none">
            </div>
        </div>

        <div class="space-y-3 mb-6">
            <div v-for="(p, index) in players" :key="index" class="card p-4 relative">
                <button @click="removePlayer(index)" class="absolute top-2 right-2 text-gray-300 text-sm">×</button>

                <div class="flex items-center gap-3 mb-3">
                    <input v-model="p.name" class="font-bold text-gray-700 w-24 border-b border-gray-100 outline-none focus:border-blue-400" placeholder="姓名">
                    <div class="flex-1 flex items-center justify-end space-x-3">
                        <button @click="p.buys > 1 && p.buys--" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-xl">-</button>
                        <span class="font-bold text-blue-600 w-12 text-center">+{{ p.buys }} 手</span>
                        <button @click="p.buys++" class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl">+</button>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-gray-50 rounded p-2 text-sm">
                    <span class="text-gray-500">剩余筹码:</span>
                    <input v-model.number="p.lastChips" type="number" class="flex-1 bg-transparent text-right font-medium outline-none" placeholder="输入最终点数">
                </div>
            </div>
        </div>

        <button @click="addPlayer" class="w-full py-3 rounded-xl border-2 border-dashed border-slate-300 text-slate-500 mb-4 hover:bg-slate-50 transition-colors">
            + 添加玩家
        </button>

        <button @click="calculate" class="w-full py-4 rounded-xl bg-blue-600 text-white font-bold text-lg shadow-lg active:scale-95 transition-transform">
            立即计算结算结果
        </button>

        <div v-if="results.length > 0" class="mt-6 p-5 card border-2 border-green-500 bg-green-50 animate-in fade-in duration-300">
            <div class="flex justify-between items-center mb-4 border-b border-green-200 pb-2">
                <h3 class="font-bold text-green-800">💰 结算账单</h3>
                <span class="text-xs bg-green-200 text-green-800 px-2 py-1 rounded">总盈亏平账</span>
            </div>
            <ul class="space-y-3">
                <li v-for="res in results" class="flex items-center justify-between text-gray-700">
                    <span><b class="text-red-500">{{ res.from }}</b> 付给 <b class="text-green-600">{{ res.to }}</b></span>
                    <span class="font-mono font-bold">{{ res.amount }} 元</span>
                </li>
            </ul>
            <div class="mt-4 text-[10px] text-gray-400 text-center">
                提示：如有小数点是因为筹码未打满一手的零钱。
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    config: { chips: 200, price: 50 },
                    players: [
                        { name: '张三', buys: 1, lastChips: 0 },
                        { name: '李四', buys: 1, lastChips: 0 }
                    ],
                    results: []
                }
            },
            methods: {
                addPlayer() {
                    this.players.push({ name: '新玩家', buys: 1, lastChips: 0 });
                },
                removePlayer(index) {
                    if(this.players.length > 1) this.players.splice(index, 1);
                },
                calculate() {
                    const ratio = this.config.price / this.config.chips;

                    // 计算每个人的净利润
                    let balances = this.players.map(p => {
                        let cost = p.buys * this.config.chips;
                        let netInChips = (p.lastChips || 0) - cost;
                        return { name: p.name, amount: netInChips * ratio };
                    });

                    // 检查是否平账
                    const totalCheck = balances.reduce((s, a) => s + a.amount, 0);
                    if(Math.abs(totalCheck) > 1) {
                        alert(`账目似乎不对劲！全场总和为 ${totalCheck.toFixed(2)}，请检查筹码是否填错。`);
                    }

                    // 贪心算法匹配转账
                    let winners = balances.filter(b => b.amount > 0).sort((a, b) => b.amount - a.amount);
                    let losers = balances.filter(b => b.amount < 0).sort((a, b) => a.amount - b.amount);

                    this.results = [];
                    while(winners.length && losers.length) {
                        let w = winners[0], l = losers[0];
                        let trans = Math.min(w.amount, Math.abs(l.amount));

                        this.results.push({
                            from: l.name,
                            to: w.name,
                            amount: trans.toFixed(2)
                        });

                        w.amount -= trans;
                        l.amount += trans;
                        if(w.amount < 0.01) winners.shift();
                        if(Math.abs(l.amount) < 0.01) losers.shift();
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
