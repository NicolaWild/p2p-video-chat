<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>德州结算助手</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-focus:focus { border-color: #3b82f6; ring: 2px; ring-color: #bfdbfe; }
    </style>
</head>
<body class="p-4 pb-12">
    <div id="app" class="max-w-md mx-auto">

        <div class="card p-4 mb-6 bg-slate-800 text-white flex items-center justify-around">
            <div class="text-center">
                <span class="block text-[10px] text-slate-400 mb-1">一手筹码</span>
                <input v-model.number="config.chips" type="number" class="w-20 bg-slate-700 rounded-lg py-2 text-center text-lg font-bold border-none outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="h-8 w-[1px] bg-slate-700"></div>
            <div class="text-center">
                <span class="block text-[10px] text-slate-400 mb-1">一手金额(元)</span>
                <input v-model.number="config.price" type="number" class="w-20 bg-slate-700 rounded-lg py-2 text-center text-lg font-bold border-none outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div class="space-y-4 mb-8">
            <div v-for="(p, index) in players" :key="index" class="card overflow-hidden border border-gray-100">
                <div class="flex">
                    <div class="flex-1 p-4">
                        <div class="flex items-center justify-between mb-4">
                            <input v-model="p.name" class="font-bold text-xl text-slate-700 w-32 border-b-2 border-gray-100 focus:border-blue-500 outline-none pb-1" placeholder="玩家姓名">
                            <div class="flex items-center bg-blue-50 rounded-xl p-1 border border-blue-100">
                                <button @click="p.buys > 1 && p.buys--" class="w-10 h-10 flex items-center justify-center text-blue-400 text-2xl font-bold active:bg-blue-100 rounded-lg">－</button>
                                <span class="px-2 font-black text-blue-700 text-base">买 {{ p.buys }} 手</span>
                                <button @click="p.buys++" class="w-10 h-10 flex items-center justify-center text-blue-600 text-2xl font-bold active:bg-blue-100 rounded-lg">＋</button>
                            </div>
                        </div>

                        <div class="flex items-center justify-between bg-slate-50 rounded-xl px-4 py-3 border border-slate-100">
                            <span class="text-sm font-bold text-slate-400">剩余筹码</span>
                            <div class="flex items-center">
                                <input v-model.number="p.lastChips" type="number" class="w-28 bg-transparent text-right font-black text-2xl text-slate-800 outline-none" placeholder="0">
                                <span class="ml-2 text-slate-400 font-bold text-sm">粒</span>
                            </div>
                        </div>
                    </div>

                    <button @click="removePlayer(index)" class="w-14 bg-red-50 flex items-center justify-center border-l border-red-100 active:bg-red-500 group transition-colors">
                        <span class="text-red-400 group-active:text-white text-xl">🗑️</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <button @click="addPlayer" class="w-full py-4 rounded-2xl border-2 border-dashed border-slate-300 bg-white text-slate-500 font-bold text-lg active:bg-slate-100">
                ＋ 添加玩家
            </button>
            <button @click="calculate" class="w-full py-5 rounded-2xl bg-blue-600 text-white font-black text-xl shadow-xl shadow-blue-200 active:scale-95 transition-all">
                🚀 开始计算
            </button>
        </div>

        <div v-if="results.length > 0" id="result-box" class="mt-8 mb-12 p-6 card border-2 border-green-500 bg-white animate-in slide-in-from-bottom duration-300">
            <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-2">
                <h3 class="font-black text-slate-800 text-lg">💰 结算账单</h3>
                <button @click="copyResults" class="text-sm font-bold text-blue-600 px-3 py-1 bg-blue-50 rounded-lg">复制文本</button>
            </div>

            <div class="space-y-4">
                <div v-for="res in results" class="flex items-center text-base py-2 border-b border-dotted border-gray-200 last:border-none">
                    <span class="font-bold text-red-500">{{ res.from }}</span>
                    <span class="mx-3 text-slate-400 text-sm italic">转给</span>
                    <span class="font-bold text-green-600">{{ res.to }}</span>
                    <span class="ml-auto font-black text-slate-800 text-lg">{{ res.amount }} <small class="text-xs font-normal">元</small></span>
                </div>
            </div>

            <p class="text-[10px] text-slate-400 mt-8 text-center leading-relaxed">
                账目计算完毕，建议核对后再转账。
            </p>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    config: { chips: 200, price: 50 },
                    players: [
                        { name: '张三', buys: 1, lastChips: 0 },
                        { name: '李四', buys: 1, lastChips: 0 }
                    ],
                    results: []
                }
            },
            methods: {
                addPlayer() {
                    this.players.push({ name: '新玩家', buys: 1, lastChips: 0 });
                },
                removePlayer(index) {
                    if (this.players.length > 1) {
                        if(confirm('确定要删除这位玩家吗？')) {
                            this.players.splice(index, 1);
                        }
                    }
                },
                calculate() {
                    const totalBought = this.players.reduce((sum, p) => sum + (p.buys * this.config.chips), 0);
                    const totalLast = this.players.reduce((sum, p) => sum + (p.lastChips || 0), 0);
                    const diff = totalLast - totalBought;

                    if (Math.abs(diff) > 0.1) {
                        const status = diff > 0 ? "多了" : "少了";
                        const money = (Math.abs(diff) * (this.config.price / this.config.chips)).toFixed(2);
                        alert(`❌ 账目不平！\n\n总筹码${status}：${Math.abs(diff)} 粒\n差额约：${money} 元\n\n请核对后再结算！`);
                        return;
                    }

                    const ratio = this.config.price / this.config.chips;
                    let balances = this.players.map(p => ({
                        name: p.name,
                        net: ((p.lastChips || 0) - (p.buys * this.config.chips)) * ratio
                    }));

                    let ws = balances.filter(b => b.net > 0.01).sort((a, b) => b.net - a.net);
                    let ls = balances.filter(b => b.net < -0.01).sort((a, b) => a.net - b.net);

                    this.results = [];
                    while(ws.length && ls.length) {
                        let w = ws[0], l = ls[0];
                        let amount = Math.min(w.net, Math.abs(l.net));
                        this.results.push({ from: l.name, to: w.name, amount: amount.toFixed(2) });
                        w.net -= amount; l.net += amount;
                        if(w.net < 0.01) ws.shift();
                        if(Math.abs(l.net) < 0.01) ls.shift();
                    }
                    setTimeout(() => document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' }), 200);
                },
                copyResults() {
                    const text = this.results.map(r => `${r.from} 转给 ${r.to} ${r.amount}元`).join('\n');
                    const el = document.createElement('textarea');
                    el.value = "📋 结算账单：\n" + text;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    alert("账单已复制！");
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
