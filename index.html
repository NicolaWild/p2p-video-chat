<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博轮盘 - 沉浸全屏版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* 消除所有默认边距，防止页面滚动 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }

        /* 全屏视频样式 */
        .fullscreen-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; transition: all 0.3s ease-in-out; }

        /* 悬浮小窗样式 (画中画) */
        .pip-video { position: absolute; width: 120px; height: 180px; top: 20px; right: 20px; border-radius: 12px; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); object-fit: cover; transform: scaleX(-1); z-index: 10; cursor: grab; /* 拖拽时取消过渡动画，否则会卡顿 */ transition: none; }
        .pip-video:active { cursor: grabbing; }

        /* UI 悬浮层 */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; /* 让鼠标事件穿透到下层 */ display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 0; box-sizing: border-box; }

        /* 顶部状态提示 */
        #status { background: rgba(0, 0, 0, 0.5); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 14px; backdrop-filter: blur(5px); }

        /* 底部操作区 */
        .bottom-controls { pointer-events: auto; /* 恢复底部按钮的点击事件 */ width: 100%; display: flex; justify-content: center; }

        button { background-color: #00ff88; color: #000; border: none; padding: 18px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4); transition: transform 0.1s, background-color 0.2s; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #555; color: #aaa; box-shadow: none; cursor: not-allowed; }

        /* 挂断/换人按钮特例 */
        .btn-next { background-color: #ff4444; color: #fff; box-shadow: 0 4px 20px rgba(255, 68, 68, 0.4); }
    </style>
</head>
<body>

    <video id="remoteVideo" class="fullscreen-video" autoplay playsinline style="display: none;"></video>
    <video id="localVideo" class="fullscreen-video" autoplay muted playsinline></video>

    <div class="ui-layer">
        <div id="status">正在打开摄像头...</div>
        <div class="bottom-controls">
            <button id="actionBtn" disabled>开始匹配</button>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const actionBtn = document.getElementById('actionBtn');

        let localStream;
        let peer;
        let mqttClient;
        let myPeerId;
        let currentCall = null;
        let isLooking = false;
        let radarInterval = null;
        let networkReady = false;

        const ROOM_TOPIC = 'cyber-roulette-lobby-v2';

        // ================= 1. 自动开启摄像头 =================
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.innerText = "正在连接网络...";
                initNetwork(); // 摄像头就绪后，初始化网络
            } catch (err) {
                statusDiv.innerText = "❌ 摄像头权限被拒绝，请允许后刷新页面";
                statusDiv.style.backgroundColor = "rgba(255, 0, 0, 0.8)";
            }
        }

        // ================= 2. 网络初始化 =================
        function initNetwork() {
            myPeerId = Math.random().toString(36).substring(2, 10);
            peer = new Peer(myPeerId, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
                mqttClient.on('connect', () => {
                    mqttClient.subscribe(ROOM_TOPIC);
                    networkReady = true;
                    statusDiv.innerText = "✅ 就绪！准备好遇见陌生人了吗？";
                    actionBtn.innerText = "开始匹配";
                    actionBtn.disabled = false;
                });

                // 处理大厅广播
                mqttClient.on('message', (topic, message) => {
                    if (!isLooking) return;
                    const msg = JSON.parse(message.toString());
                    if (msg.id === myPeerId) return;

                    if (msg.type === 'looking' && myPeerId > msg.id) {
                        connectToStranger(msg.id);
                    }
                });
            });

            // 处理被动接听
            peer.on('call', (call) => {
                if (!isLooking) {
                    setTimeout(() => call.close(), 500);
                    return;
                }
                stopLooking();
                statusDiv.innerText = "收到连接，正在接通...";
                call.answer(localStream);
                handleCall(call);
            });
        }

        // ================= 3. 匹配与通话逻辑 =================
        function startLooking() {
            if (currentCall) { currentCall.close(); }

            // UI 状态切回等待界面：我的画面全屏，隐藏对方画面
            switchToWaitingUI();

            isLooking = true;
            statusDiv.innerText = "📡 正在茫茫人海中寻找...";
            actionBtn.innerText = "匹配中...";
            actionBtn.disabled = true; // 匹配中防止狂点

            radarInterval = setInterval(() => {
                if (isLooking) mqttClient.publish(ROOM_TOPIC, JSON.stringify({ type: 'looking', id: myPeerId }));
            }, 2000);
        }

        function stopLooking() {
            isLooking = false;
            if (radarInterval) clearInterval(radarInterval);
        }

        function connectToStranger(targetPeerId) {
            stopLooking();
            statusDiv.innerText = "锁定目标，建立加密直连...";
            const call = peer.call(targetPeerId, localStream);
            handleCall(call);
        }

        function handleCall(call) {
            currentCall = call;

            call.on('stream', (remoteStream) => {
                if (remoteVideo.srcObject !== remoteStream) {
                    remoteVideo.srcObject = remoteStream;
                }

                remoteVideo.play().then(() => {
                    // 核心UI切换：连接成功，对方全屏，我变小窗
                    switchToConnectedUI();
                }).catch((err) => {
                    statusDiv.innerText = "⚠️ 请轻触屏幕任意位置播放画面";
                    document.body.onclick = () => { remoteVideo.play(); switchToConnectedUI(); document.body.onclick = null; };
                });
            });

            call.on('close', () => {
                if (!isLooking) startLooking(); // 对方挂断，自动继续找
            });
            call.on('error', () => { startLooking(); });
        }

        // ================= 4. UI 切换控制 =================
        function switchToWaitingUI() {
            remoteVideo.style.display = 'none';
            remoteVideo.srcObject = null;
            localVideo.className = 'fullscreen-video'; // 我恢复全屏
            // 清除拖拽留下的内联样式
            localVideo.style.left = ''; localVideo.style.top = ''; localVideo.style.right = '';
            actionBtn.className = '';
        }

        function switchToConnectedUI() {
            statusDiv.innerText = "🟢 已连接，可以打个招呼！";
            remoteVideo.style.display = 'block'; // 显示对方全屏
            localVideo.className = 'pip-video'; // 我变成画中画

            actionBtn.disabled = false;
            actionBtn.innerText = "⏭️ 换一个人";
            actionBtn.className = 'btn-next';
        }

        // 按钮统一事件处理
        actionBtn.onclick = () => {
            if (!networkReady) return;
            startLooking(); // 无论是开始还是换人，逻辑都是重新 startLooking
        };

        // ================= 5. 小窗拖拽逻辑 (支持触摸和鼠标) =================
        let isDragging = false;
        let offsetX, offsetY;

        const dragStart = (e) => {
            if (localVideo.className !== 'pip-video') return; // 只有小窗模式才能拖
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = localVideo.getBoundingClientRect();
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
        };

        const dragMove = (e) => {
            if (!isDragging) return;
            e.preventDefault(); // 防止拖拽时屏幕滚动
            const touch = e.touches ? e.touches[0] : e;
            // 解除 right 限制，使用 left 和 top 进行绝对定位
            localVideo.style.right = 'auto';

            // 限制拖拽边界，防止拖出屏幕边缘
            let newX = touch.clientX - offsetX;
            let newY = touch.clientY - offsetY;
            const maxX = window.innerWidth - localVideo.offsetWidth;
            const maxY = window.innerHeight - localVideo.offsetHeight;

            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));

            localVideo.style.left = `${newX}px`;
            localVideo.style.top = `${newY}px`;
        };

        const dragEnd = () => { isDragging = false; };

        // 绑定拖拽事件
        localVideo.addEventListener('mousedown', dragStart);
        localVideo.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('touchend', dragEnd);

        // ================= 启动应用 =================
        // 页面加载完成后立刻请求摄像头
        window.onload = () => {
            initCamera();
        };

    </script>
</body>
</html>
