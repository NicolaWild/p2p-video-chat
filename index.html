<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P 纯前端视频匹配 (终极穿透版)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .video-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        video { width: 100%; max-width: 400px; height: 250px; background-color: #000; border-radius: 12px; border: 2px solid #333; object-fit: cover; transform: scaleX(-1); }
        button { background-color: #00ff88; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        #status { margin-top: 15px; color: #ffeb3b; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>赛博轮盘 P2P (终极穿透版)</h2>
    <div id="status">正在连接公共信令网络...</div>

    <button id="matchBtn" disabled>连接摄像头并寻找</button>

    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const matchBtn = document.getElementById('matchBtn');
        const statusDiv = document.getElementById('status');

        let localStream;
        let peerConnection = null;
        let iceCandidateQueue = []; // 用来暂存提前到达的打洞信息

        const myId = Math.random().toString(36).substring(2, 10);
        const ROOM_TOPIC = 'cyber-roulette-demo-v3';

        // 使用极其稳定的 Eclipse 443 端口节点，绕过防火墙
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        let isLooking = false;
        let radarInterval = null;

        client.on('connect', () => {
            statusDiv.innerText = "网络已连接，随时可以开始！";
            matchBtn.disabled = false;
            client.subscribe(ROOM_TOPIC);
        });

        // 谷歌免费公共 STUN 打洞服务器
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        matchBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                isLooking = true;
                matchBtn.disabled = true;
                statusDiv.innerText = "雷达开启：每2秒发送一次寻找信号...";

                radarInterval = setInterval(() => {
                    if (isLooking) broadcast({ type: 'looking', id: myId });
                }, 2000);
            } catch (err) {
                alert("摄像头获取失败！" + err.message);
            }
        };

        client.on('message', async (topic, message) => {
            const msg = JSON.parse(message.toString());
            if (msg.sender === myId || msg.id === myId) return;

            if (msg.type === 'looking' && isLooking) {
                if (myId > msg.id && !peerConnection) {
                    stopRadar();
                    statusDiv.innerText = "锁定目标，正在拨号中...";
                    initiateCall(msg.id);
                }
            }

            if (msg.type === 'offer' && msg.target === myId) {
                if (!isLooking) return;
                stopRadar();
                statusDiv.innerText = "收到视频邀请，正在接听...";

                createPeerConnection(msg.sender);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));

                // 处理暂存的打洞信息
                processIceQueue();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                broadcast({ type: 'answer', target: msg.sender, sender: myId, sdp: peerConnection.localDescription });
            }

            if (msg.type === 'answer' && msg.target === myId) {
                if (peerConnection) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    statusDiv.innerText = "P2P 握手成功，底层网络打洞中...";
                    processIceQueue();
                }
            }

            if (msg.type === 'ice' && msg.target === myId) {
                if (peerConnection && peerConnection.remoteDescription) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
                } else {
                    // 如果名片还没交换完，先把打洞信息存起来
                    iceCandidateQueue.push(msg.candidate);
                }
            }
        });

        function stopRadar() {
            isLooking = false;
            if (radarInterval) clearInterval(radarInterval);
        }

        async function processIceQueue() {
            for (const candidate of iceCandidateQueue) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
            iceCandidateQueue = [];
        }

        async function initiateCall(targetId) {
            createPeerConnection(targetId);
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            broadcast({ type: 'offer', target: targetId, sender: myId, sdp: peerConnection.localDescription });
        }

        function createPeerConnection(targetId) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // 监控底层网络状态
            peerConnection.oniceconnectionstatechange = () => {
                console.log("当前 P2P 状态:", peerConnection.iceConnectionState);
                if (peerConnection.iceConnectionState === 'connected') {
                    statusDiv.innerText = "🟢 网络穿透成功！完全去中心化直连！";
                    statusDiv.style.color = "#00ff88";
                } else if (peerConnection.iceConnectionState === 'failed') {
                    statusDiv.innerText = "❌ 防火墙太厚，P2P 打洞失败！(尝试连同一个WiFi)";
                    statusDiv.style.color = "#ff4444";
                }
            };

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                // 强制唤醒手机浏览器的视频播放
                remoteVideo.play().catch(e => console.error("视频自动播放被拦截:", e));
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    broadcast({ type: 'ice', target: targetId, sender: myId, candidate: event.candidate });
                }
            };
        }

        function broadcast(data) {
            client.publish(ROOM_TOPIC, JSON.stringify(data));
        }
    </script>
</body>
</html>
